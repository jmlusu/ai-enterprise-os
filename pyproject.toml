[project]
name = "ai-company"
version = "0.1.0"
description = "AI Enterprise OS — scalable local AI agent workflows"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "Jinja2>=3.1.6",
    "PyYAML>=6.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "networkx>=3.6.1",
    "shellingham>=1.5.4",
]

[project.scripts]
ai-company = "ai_company.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py312"
exclude = [".venv", ".opencode", "generated", "test_output"]

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except Exception — acceptable for graceful error handling
    "C401",     # unnecessary generator — set comprehensions don't always improve clarity
    "C408",     # unnecessary dict() call — dict() is sometimes clearer
    "DTZ005",   # datetime.now() without tz — naive datetimes are acceptable here
    "DTZ006",   # datetime.fromtimestamp() without tz
    "RUF012",   # mutable class vars — intentional for PROVIDERS lookup table
    "RUF015",   # prefer next(iter(...)) — list indexing is more readable
    "RUF022",   # __all__ not sorted — not actionable for this project
    "RUF059",   # unused unpacked var — sometimes needed for API compatibility
    "S110",     # try-except-pass — intentionally used for warm-up renders
    "SIM102",   # nested if statements — nested ifs are more readable sometimes
    "SIM103",   # return condition directly — explicit returns are clearer
    "SIM114",   # combine if branches — separate branches are more maintainable
    "TC005",    # empty type-checking block — placeholder for future types
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [".venv", "generated"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_company"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
