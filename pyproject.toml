[project]
name = "ai-company"
version = "0.1.0"
description = "AI Enterprise OS — scalable local AI agent workflows"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "Jinja2>=3.1.6",
    "PyYAML>=6.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "networkx>=3.6.1",
    "shellingham>=1.5.4",
]

[project.scripts]
ai-company = "ai_company.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_company"]

[tool.pytest.ini_options]
testpaths = ["tests"]
