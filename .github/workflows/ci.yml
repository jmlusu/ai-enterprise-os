name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Windows-first project (risk R10): lint and type-check run on both
  # ubuntu-latest and windows-latest (decided Sprint 5.3 — previously only
  # the test job covered Windows).
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: Ruff check
        run: uv run --group dev ruff check
      - name: Ruff format
        run: uv run --group dev ruff format --check
      - name: Lockfile check
        run: uv lock --check
      - name: uv audit
        run: uv audit
      - name: Command map integrity
        run: uv run python -m ai_company.integrity.check_command_map

  type-check:
    name: Type check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: mypy
        run: uv run --group dev mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: pytest
        run: |
          uv run --group dev pytest --verbose --tb=short -q
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "No tests collected - this is fine, no test files exist yet"
            exit 0
          fi
          exit $rc

  # Windows-first project (risk R10): the full suite must pass on
  # windows-latest, not just Ubuntu. Uses bash for the rc-5 guard
  # (Git Bash ships on GitHub Windows runners).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: pytest
        shell: bash
        run: |
          uv run --group dev pytest --verbose --tb=short -q
          rc=$?
          if [ $rc -eq 5 ]; then
            echo "No tests collected - this is fine, no test files exist yet"
            exit 0
          fi
          exit $rc

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Generate artifacts
        run: uv run ai-company build
      - name: Validate registry
        run: uv run ai-company validate

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Build package
        run: uv build
      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
