name: Nightly Backup

on:
  schedule:
    # 02:00 UTC every night
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Create runtime dirs (fresh checkout has none)
        run: mkdir -p .ai-company memory events generated runtime
      - name: Create backup bundle
        run: uv run python -m ai_company.backup
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-enterprise-os-backup
          path: backups/
          if-no-files-found: error
          retention-days: 30
