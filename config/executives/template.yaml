# Executive Template Configuration
# Defines the structure of per-executive generated artifacts.
# Each field maps to a template section used by ExecutiveGenerator.

agent_py_template: |
  \"\"\"Agent wrapper for {name} — {title}.
  Auto-generated by ExecutiveGenerator. Do not edit directly.
  \"\"\"

  from pathlib import Path
  from typing import Any

  import yaml


  class {python_class_name}Agent:
      \"\"\"{title} agent with loaded configuration.\"\"\"

      def __init__(self, config_dir: str | Path = "{config_dir}") -> None:
          self.config_dir = Path(config_dir)
          self.config = self._load_config()
          self.name: str = "{name}"
          self.title: str = "{title}"
          self.model: str = "{agent_model}"
          self.temperature: float = {agent_temperature}

      def _load_config(self) -> dict[str, Any]:
          path = self.config_dir / "executive.yaml"
          if not path.exists():
              return {{}}
          with open(path, "r", encoding="utf-8") as f:
              return yaml.safe_load(f) or {{}}

      @property
      def tools(self) -> list[str]:
          return {agent_tools_list}

      def __repr__(self) -> str:
          return f"<{{self.__class__.__name__}}: {{self.name}} ({{self.title}})>"

