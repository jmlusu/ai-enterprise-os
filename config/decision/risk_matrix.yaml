# Risk Matrix Configuration
# Defines risk evaluation criteria and thresholds for the Decision Engine
# All risk rules come from YAML - no hardcoded logic

version: "1.0"
description: "Risk matrix for AI Enterprise OS Decision Engine"

# Risk levels with score thresholds
risk_levels:
  very_low:
    name: "Very Low"
    description: "Minimal risk, routine decisions"
    min_score: 0.0
    max_score: 0.2
    color: "green"
    auto_approve: true

  low:
    name: "Low"
    description: "Low risk, standard approval"
    min_score: 0.2
    max_score: 0.4
    color: "lightgreen"
    auto_approve: true

  medium:
    name: "Medium"
    description: "Moderate risk, requires review"
    min_score: 0.4
    max_score: 0.6
    color: "yellow"
    auto_approve: false

  high:
    name: "High"
    description: "High risk, requires escalation"
    min_score: 0.6
    max_score: 0.8
    color: "orange"
    auto_approve: false
    requires_escalation: true

  critical:
    name: "Critical"
    description: "Critical risk, Board-level decision"
    min_score: 0.8
    max_score: 1.0
    color: "red"
    auto_approve: false
    requires_escalation: true
    requires_board_approval: true

# Risk factors with weights
risk_factors:
  financial_impact:
    name: "Financial Impact"
    description: "Monetary impact of the decision"
    weight: 3.0
    category: "financial"
    thresholds:
      - condition: "budget < 10000"
        score: 0.1
      - condition: "budget >= 10000 and budget < 50000"
        score: 0.3
      - condition: "budget >= 50000 and budget < 200000"
        score: 0.5
      - condition: "budget >= 200000 and budget < 1000000"
        score: 0.7
      - condition: "budget >= 1000000"
        score: 0.9

  compliance_risk:
    name: "Compliance Risk"
    description: "Regulatory and compliance implications"
    weight: 4.0
    category: "compliance"
    thresholds:
      - condition: "category == 'compliance'"
        score: 0.8
      - condition: "category == 'governance'"
        score: 0.6
      - condition: "category == 'financial'"
        score: 0.4
      - condition: "true"
        score: 0.1

  reputation_risk:
    name: "Reputation Risk"
    description: "Impact on company reputation"
    weight: 2.5
    category: "strategic"
    thresholds:
      - condition: "decision_type == 'public_announcement'"
        score: 0.7
      - condition: "decision_type == 'partnership'"
        score: 0.5
      - condition: "decision_type == 'acquisition'"
        score: 0.9
      - condition: "stakeholder_count > 10"
        score: 0.4
      - condition: "true"
        score: 0.1

  operational_impact:
    name: "Operational Impact"
    description: "Effect on day-to-day operations"
    weight: 2.0
    category: "operational"
    thresholds:
      - condition: "duration_months >= 6"
        score: 0.7
      - condition: "duration_months >= 3"
        score: 0.5
      - condition: "affected_departments > 3"
        score: 0.6
      - condition: "affected_departments > 1"
        score: 0.3
      - condition: "true"
        score: 0.1

  technical_complexity:
    name: "Technical Complexity"
    description: "Technical implementation difficulty"
    weight: 1.5
    category: "technical"
    thresholds:
      - condition: "decision_type == 'architecture_change'"
        score: 0.8
      - condition: "decision_type == 'tech_stack_change'"
        score: 0.6
      - condition: "decision_type == 'integration'"
        score: 0.4
      - condition: "true"
        score: 0.1

  stakeholder_impact:
    name: "Stakeholder Impact"
    description: "Number and importance of affected stakeholders"
    weight: 2.0
    category: "social"
    thresholds:
      - condition: "stakeholder_count > 20"
        score: 0.8
      - condition: "stakeholder_count > 10"
        score: 0.6
      - condition: "stakeholder_count > 5"
        score: 0.4
      - condition: "true"
        score: 0.1

  time_pressure:
    name: "Time Pressure"
    description: "Urgency of the decision"
    weight: 1.0
    category: "operational"
    thresholds:
      - condition: "urgency == 'emergency'"
        score: 0.9
      - condition: "urgency == 'critical'"
        score: 0.7
      - condition: "urgency == 'high'"
        score: 0.5
      - condition: "urgency == 'medium'"
        score: 0.3
      - condition: "true"
        score: 0.1

  data_security:
    name: "Data Security"
    description: "Data security and privacy implications"
    weight: 4.5
    category: "compliance"
    thresholds:
      - condition: "data_classification == 'classified'"
        score: 0.9
      - condition: "data_classification == 'confidential'"
        score: 0.7
      - condition: "data_classification == 'internal'"
        score: 0.4
      - condition: "decision_type == 'security_policy'"
        score: 0.8
      - condition: "true"
        score: 0.1

# Category-specific risk modifiers
category_modifiers:
  strategic:
    multiplier: 1.3
    description: "Strategic decisions carry higher inherent risk"

  financial:
    multiplier: 1.2
    description: "Financial decisions have quantifiable risk"

  compliance:
    multiplier: 1.4
    description: "Compliance decisions have regulatory exposure"

  technical:
    multiplier: 1.1
    description: "Technical decisions have implementation risk"

  hr:
    multiplier: 1.15
    description: "HR decisions affect people directly"

  operational:
    multiplier: 1.0
    description: "Operational decisions baseline risk"

# Escalation triggers
escalation_triggers:
  - name: "Critical Risk Score"
    condition: "risk_score >= 0.8"
    action: "escalate_to_board"
    description: "Automatically escalate critical risk decisions to Board"

  - name: "High Risk with No Approver"
    condition: "risk_score >= 0.6 and approver is None"
    action: "escalate_to_ceo"
    description: "Escalate high-risk decisions without assigned approver to CEO"

  - name: "Compliance Category High Risk"
    condition: "category == 'compliance' and risk_score >= 0.5"
    action: "escalate_to_clo"
    description: "Route compliance high-risk decisions to CLO"

  - name: "Financial High Risk"
    condition: "category == 'financial' and risk_score >= 0.7"
    action: "escalate_to_cfo"
    description: "Route high-risk financial decisions to CFO"

  - name: "Multiple Department Impact"
    condition: "affected_departments > 3"
    action: "escalate_to_coo"
    description: "Cross-departmental impact escalates to COO"
