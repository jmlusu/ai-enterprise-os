# Orchestration Retry Configuration
# Default retry policy applied to pipeline tasks that do not declare
# their own retry settings.

version: "1.0"
description: "Retry policy settings for the Enterprise Orchestration Engine"

retries:
  default_max_retries: 3           # attempts beyond the first
  backoff_base_seconds: 1.0        # first backoff delay
  backoff_multiplier: 2.0          # exponential growth factor
  max_backoff_seconds: 60.0        # cap on per-attempt backoff
  jitter: 0.1                      # random jitter fraction (0 = none)
  timeout_seconds: 3600            # per-task timeout
  retryable_errors:
    - "TimeoutError"
    - "ConnectionError"
    - "TaskExecutionError"
  # Non-retryable by default: validation, dependency, planning errors
